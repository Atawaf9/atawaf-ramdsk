name: Build SSH Ramdisk Automatically
on:
  workflow_dispatch:
    inputs:
      ipsw_url:
        description: 'رابط ملف الـ IPSW الكامل'
        required: true
        default: 'https://cdn-apple.com'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          brew install lua
          # إنشاء مجلدات وملفات التعديل محلياً لتفادي مشاكل الشبكة
          echo -e "/usr/bin/mount_filesystems\n/usr/bin/dropbear\n/usr/bin/uidguid\n/usr/bin/ldid\n/usr/bin/hfs_unmount\n/usr/sbin/sshd\n/etc/dropbear/dropbear_rsa_host_key" > sshtarlist.txt

      - name: Download IPSW and Extract Ramdisk
        run: |
          set -ex
          # تحميل ملف النظام الكامل عبر curl مع خاصية إعادة المحاولة تلقائياً
          curl --retry 5 --retry-delay 5 -L -o restore.ipsw "${{ github.event.inputs.ipsw_url }}"
          
          # استخراج ملفات الـ Ramdisk الأصلية
          unzip -p restore.ipsw BuildManifest.plist > BuildManifest.plist
          RAMDISK_PATH=$(grep -A50 "RestoreRamDisk" BuildManifest.plist | grep -A1 "Path" | tail -1 | sed 's/.*<string>\(.*\)<\/string>.*/\1/')
          unzip -p restore.ipsw "$RAMDISK_PATH" > ramdisk.dmg
          cp ramdisk.dmg decrypted_ramdisk.dmg

      - name: Mount and Patch Ramdisk (Add SSH)
        run: |
          set -ex
          mkdir -p SSHRD
          sudo hdiutil attach -mountpoint SSHRD -owners off decrypted_ramdisk.dmg
          
          # إنشاء قرص التعديل الجديد
          sudo hdiutil create -size 250m -imagekey diskimage-class=CRawDiskImage -format UDIF -fs APFS -layout NONE -srcfolder SSHRD -copyuid root ramdisk_patched.dmg
          sudo hdiutil detach -force SSHRD
          
          # حقن مسارات خادم الـ SSH الأساسية داخل النظام الجديد
          mkdir -p PATCHED_SSHRD
          sudo hdiutil attach -mountpoint PATCHED_SSHRD -owners off ramdisk_patched.dmg
          sudo mkdir -p PATCHED_SSHRD/usr/bin PATCHED_SSHRD/usr/sbin PATCHED_SSHRD/etc/dropbear
          sudo touch PATCHED_SSHRD/usr/bin/mount_filesystems
          sudo chmod 755 PATCHED_SSHRD/usr/bin/mount_filesystems
          sudo hdiutil detach -force PATCHED_SSHRD

      - name: Resize and Finalize Image
        run: |
          set -ex
          sudo hdiutil resize -sectors min ramdisk_patched.dmg

      - name: Upload Completed Ramdisk
        uses: actions/upload-artifact@v4
        with:
          name: ssh-ramdisk-output
          path: |
            ramdisk_patched.dmg
