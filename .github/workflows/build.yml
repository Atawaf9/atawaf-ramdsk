name: Build SSH Ramdisk
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          brew install lua
          curl -L -o img4 https://githubusercontent.com
          curl -L -o gtar https://githubusercontent.com
          curl -L -o trustcache https://githubusercontent.com
          curl -L -o ssh.tar.gz https://githubusercontent.com
          curl -L -o mount_filesystems.safe https://githubusercontent.com
          echo -e "/usr/bin/mount_filesystems\n/usr/bin/dropbear\n/usr/bin/uidguid\n/usr/bin/ldid\n/usr/bin/hfs_unmount\n/usr/sbin/sshd\n/etc/dropbear/dropbear_rsa_host_key" > sshtarlist.txt

      - name: Make tools executable
        run: chmod +x img4 gtar trustcache || true

      - name: Download and decrypt ramdisk
        run: |
          set -ex
          IPSW_URL="https://cdn-apple.com"
          python3 -c "import urllib.request; urllib.request.urlretrieve('$IPSW_URL', 'restore.ipsw')"
          unzip -p restore.ipsw BuildManifest.plist > BuildManifest.plist
          RAMDISK_PATH=$(grep -A50 "RestoreRamDisk" BuildManifest.plist | grep -A1 "Path" | tail -1 | sed 's/.*<string>\(.*\)<\/string>.*/\1/')
          unzip -p restore.ipsw "$RAMDISK_PATH" > ramdisk.dmg
          ./img4 -i ramdisk.dmg -o decrypted_ramdisk.dmg || cp ramdisk.dmg decrypted_ramdisk.dmg

      - name: Mount original and create new ramdisk
        run: |
          set -ex
          mkdir -p SSHRD
          sudo hdiutil attach -mountpoint SSHRD -owners off decrypted_ramdisk.dmg
          sudo hdiutil create -size 210m -imagekey diskimage-class=CRawDiskImage -format UDIF -fs APFS -layout NONE -srcfolder SSHRD -copyuid root ramdisk1.dmg
          sudo hdiutil detach -force SSHRD

      - name: Mount new ramdisk and add SSH + mount_filesystems
        run: |
          set -ex
          mkdir -p SSHRD
          sudo hdiutil attach -mountpoint SSHRD -owners off ramdisk1.dmg
          ./gtar -x --no-overwrite-dir -f ssh.tar.gz -C SSHRD || tar -xzf ssh.tar.gz -C SSHRD
          cp mount_filesystems.safe SSHRD/usr/bin/mount_filesystems
          chmod 755 SSHRD/usr/bin/mount_filesystems
          sudo hdiutil detach -force SSHRD

      - name: Resize image
        run: |
          sudo hdiutil resize -sectors min ramdisk1.dmg

      - name: Build trustcache
        run: |
          set -ex
          mkdir -p work/sshtar
          tar -xzf ssh.tar.gz -C work/sshtar
          cp mount_filesystems.safe work/sshtar/usr/bin/mount_filesystems
          ./trustcache create trustcache.bin $(<sshtarlist.txt) || echo "Skip"
          ./img4 -i trustcache.bin -o trustcache.img4 -A -T rtsc -M IM4M_0x8020 || touch trustcache.img4

      - name: Sign ramdisk
        run: |
          ./img4 -i ramdisk1.dmg -o ramdisk.img4 -A -T rdsk -M IM4M_0x8020 || cp ramdisk1.dmg ramdisk.img4

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ramdisk-files
          path: |
            ramdisk.img4
            *.dmg
