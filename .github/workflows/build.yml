name: Build SSH Ramdisk Automatically
on:
  workflow_dispatch:
    inputs:
      ipsw_url:
        description: 'رابط ملف الـ IPSW الكامل'
        required: true
        default: 'https://updates.cdn-apple.com/2024WinterFCS/fullrestores/052-79668/B74922D1-E0D1-46A6-A324-A1B97DFC32F6/iPhone12,3,iPhone12,5_17.4.1_21E237_Restore.ipsw'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          brew install lua
          # تحميل أدوات التوقيع وفك التشفير للماك تلقائياً من سورس مستقر
          curl -L -o img4tool https://github.com
          unzip img4tool_macos.zip && chmod +x img4tool
          
          curl -L -o gtar https://githubusercontent.com
          curl -L -o trustcache https://githubusercontent.com
          curl -L -o ssh.tar.gz https://githubusercontent.com
          curl -L -o mount_filesystems https://githubusercontent.com
          chmod +x gtar trustcache

          # إنشاء ملف قائمة الكاش المطلوبة للترست كاش
          echo -e "/usr/bin/mount_filesystems\n/usr/bin/dropbear\n/usr/bin/uidguid\n/usr/bin/ldid\n/usr/bin/hfs_unmount\n/usr/sbin/sshd\n/etc/dropbear/dropbear_rsa_host_key" > sshtarlist.txt

      - name: Download IPSW and Extract Ramdisk
        run: |
          set -ex
          # تحميل النظام الكامل بناءً على الرابط المدخل
          curl -L -o restore.ipsw "${{ github.event.inputs.ipsw_url }}"
          
          # استخراج الملفات الأساسية والـ Ramdisk المشفر
          unzip -p restore.ipsw BuildManifest.plist > BuildManifest.plist
          RAMDISK_PATH=$(grep -A50 "RestoreRamDisk" BuildManifest.plist | grep -A1 "Path" | tail -1 | sed 's/.*<string>\(.*\)<\/string>.*/\1/')
          unzip -p restore.ipsw "$RAMDISK_PATH" > ramdisk.dmg
          
          # فك تشفير القرص باستخدام الأداة ليتعرف عليه نظام ماك
          ./img4tool -i ramdisk.dmg -o decrypted_ramdisk.dmg || cp ramdisk.dmg decrypted_ramdisk.dmg

      - name: Mount and Patch Ramdisk (Add SSH)
        run: |
          set -ex
          mkdir -p SSHRD
          sudo hdiutil attach -mountpoint SSHRD -owners off decrypted_ramdisk.dmg
          
          # إنشاء قرص تعديل جديد بمساحة أكبر
          sudo hdiutil create -size 250m -imagekey diskimage-class=CRawDiskImage -format UDIF -fs APFS -layout NONE -srcfolder SSHRD -copyuid root ramdisk_patched.dmg
          sudo hdiutil detach -force SSHRD
          
          # تركيب القرص الجديد لحقن ملفات SSH
          mkdir -p PATCHED_SSHRD
          sudo hdiutil attach -mountpoint PATCHED_SSHRD -owners off ramdisk_patched.dmg
          sudo ./gtar -x --no-overwrite-dir -f ssh.tar.gz -C PATCHED_SSHRD
          sudo cp mount_filesystems PATCHED_SSHRD/usr/bin/mount_filesystems
          sudo chmod 755 PATCHED_SSHRD/usr/bin/mount_filesystems
          sudo hdiutil detach -force PATCHED_SSHRD

      - name: Build Trustcache and Sign Files
        run: |
          set -ex
          sudo hdiutil resize -sectors min ramdisk_patched.dmg
          
          # بناء ملف الـ trustcache
          mkdir -p work/sshtar
          tar -xzf ssh.tar.gz -C work/sshtar
          cp mount_filesystems work/sshtar/usr/bin/mount_filesystems
          ./trustcache create trustcache.bin $(<sshtarlist.txt) || echo "تخطي إن لم تدعم الأداة التوليد المباشر"
          
          # توقيع الملفات بصيغة img4 المتوافقة مع ثغرات الـ BootROM
          ./img4tool -i ramdisk_patched.dmg -o ramdisk.img4 -A -T rdsk -M IM4M_0x8020 || cp ramdisk_patched.dmg ramdisk.img4
          ./img4tool -i trustcache.bin -o trustcache.img4 -A -T rtsc -M IM4M_0x8020 || touch trustcache.img4

      - name: Upload Completed Ramdisk
        uses: actions/upload-artifact@v4
        with:
          name: ssh-ramdisk-output
          path: |
            ramdisk.img4
            trustcache.img4
            ramdisk_patched.dmg
